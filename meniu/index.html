<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gurmand – Meniu</title>
<meta name="description" content="Meniul Gurmand cu ingrediente, alergeni și valori nutriționale.">
<meta name="theme-color" content="#0d0d0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--panel:#161616;--line:#2b2b2b;--tx:#f4f1ea;--mut:#9b9788;--y:#ffc20e;--red:#e8452c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 16px/1.45 Nunito,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.hero{text-align:center;padding:36px 16px 22px;border-bottom:4px solid var(--y)}
.hero h1{font:900 clamp(52px,15vw,96px)/1 Fraunces,Georgia,serif;letter-spacing:0;text-transform:uppercase;color:var(--y)}
.hero p{margin-top:12px;font:700 clamp(15px,4vw,19px)/1.2 Nunito,Arial,sans-serif;letter-spacing:.5px;color:var(--tx)}
.hero p i{font-style:normal;color:var(--y);margin:0 6px}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px}
.wrap{max-width:1180px;margin:auto}
.row{display:flex;gap:10px;align-items:center}
.search{flex:1;border-radius:24px !important;background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:11px 14px;font:500 16px Nunito,sans-serif;border-radius:4px;min-width:0}
.search:focus{outline:2px solid var(--y);border-color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--tx);padding:6px 13px;font:700 14.5px Nunito,sans-serif;border-radius:20px;cursor:pointer}
.chip.on{background:var(--y);border-color:var(--y);color:#111}
main{padding:6px 14px 30px}
.cat{font:700 30px Fraunces,Georgia,serif;margin:26px 0 12px;display:flex;align-items:center;gap:12px}
.cat:after{content:"";flex:1;height:2px;background:var(--line)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:12px;align-items:center}
.ic{flex:none;width:60px;height:60px;border-radius:14px;background:#221d0c;display:grid;place-items:center}
.ic svg{width:44px;height:44px}
.nm{flex:1;font:800 19px/1.15 Nunito,sans-serif}
.nm small{display:block;margin-top:3px;font:500 13px Nunito,sans-serif;letter-spacing:0;text-transform:none;color:var(--mut)}
.pr{flex:none;background:var(--y);color:#111;font:900 19px Nunito,sans-serif;padding:5px 12px;border-radius:14px;letter-spacing:.5px;white-space:nowrap}
.h{font:800 13px Nunito,sans-serif;color:var(--y);margin-bottom:3px}
.ing{font-size:15px;color:#d9d5c8}
.inc{font-size:13.5px;color:var(--y);border:1px dashed #5a4a10;border-radius:10px;padding:8px 10px}
.inc .sw{margin-top:8px}
.inc ul{list-style:none;padding:0;margin:4px 0 0}
.inc li{padding-left:16px;position:relative}
.inc li:before{content:"–";position:absolute;left:2px}
.post{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:2px 10px 2px 8px;border-radius:12px;border:1px solid #2e5a34;background:#122015;color:#8fd9a3;font:700 13px Nunito,sans-serif}
.post i{width:9px;height:9px;border-radius:50%;background:#3ecf5a;display:inline-block}
.ing b{font-weight:600;color:var(--mut);white-space:nowrap}
.al{display:flex;flex-wrap:wrap;gap:5px}
.al span{border:1px solid #6b2a1d;background:#2a1511;color:#ff9a82;font:700 13px Nunito,sans-serif;padding:1px 10px;border-radius:12px}
.al span.sos{border-color:#5a4a10;background:#241d08;color:#ffd466}
.al span.ok{border-color:#2e4a2e;background:#142014;color:#8fd08f}
.nut{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.nut div{text-align:center;padding:6px 2px;border-right:1px solid var(--line)}
.nut div:last-child{border:0}
.nut strong{display:block;font:800 17px/1.2 Nunito,sans-serif}
.nut span{font-size:11px;color:var(--mut);letter-spacing:.3px}
.nut .kc strong{color:var(--y)}
@media(max-width:600px){.bar{position:static !important}}
.note2{color:var(--mut);font-size:14px;margin:-4px 0 12px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.note{margin-top:30px;padding:14px 16px;border-left:4px solid var(--y);background:var(--panel);font-size:14px;color:#d9d5c8}
footer{text-align:center;color:var(--mut);font-size:13px;padding:6px 16px 36px}
</style>
</head>

 <div><div class="h">Ciorbe în rotație</div><div class="ing">Rădăuțeană · De burtă · De fasole de post · De afumătură</div></div>
 <div><div class="h">Alergeni</div><div class="al"><span class="sos">Variabili în funcție de ciorba zilei</span></div></div>
 <div class="inc">Alergenii și valorile nutriționale se schimbă de la o ciorbă la alta. Întreabă casierul ce ciorbă e azi și ce conține.</div></article>`;
}
function render(){
 const q=norm($("#q").value.trim());let h="";
 document.querySelectorAll("#cats .chip").forEach(b=>b.classList.toggle("on",b.dataset.c===cat));
 const all=cat==="Toate";
 for(const c of D.cats){
  if(!all&&cat!==c.c)continue;
  const f=c.items.filter(i=>!q||norm(i.n).includes(q)||i.ing.some(g=>norm(g[0]).includes(q)));
  if(f.length)h+=`<div class="cat">${c.c}</div><div class="grid">${f.map(card).join("")}</div>`;
 }
 if((all||cat===CIORBA)&&(!q||norm("ciorba zilei radauteana burta fasole afumatura").includes(q)))h+=`<div class="cat">${CIORBA}</div><div class="grid">${ciorba()}</div>`;
 if(all||cat===SAUCE_CAT){const f=D.sauces.filter(s=>!q||norm(s.n+" "+s.d).includes(q));if(f.length)h+=`<div class="cat">Sosuri</div><div class="note2">Alege-le la meniuri sau separat. Sosul inclus la meniu poate fi schimbat cu oricare alt sos.</div><div class="grid">${f.map(sauce).join("")}</div>`}
 $("#list").innerHTML=h||'<div class="empty">Niciun produs găsit.</div>';
}
$("#cats").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$("#q").oninput=render;render();
</script>
</body>
